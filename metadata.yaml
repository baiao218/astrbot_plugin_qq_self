name: astrbot_plugin_qq_self
display_name: 自我形象
short_desc: 让她自己换 QQ 头像、改个性签名——按心情，而不是按指令
desc: |
  她有自己的账号，也就该有自己的样子。

  这个插件把「换头像」和「改签名」交给她自己：想换的时候换，想写什么写什么，
  不用每次都来问你。

  **依赖的 OneBot 扩展接口**

  | 动作 | 作用 | 参数 |
  |---|---|---|
  | `set_qq_avatar` | 设置 QQ 头像 | `file`：本地路径 / URL / base64 |
  | `set_self_longnick` | 设置个性签名 | `longNick` |

  两个都是 NapCat 的扩展接口，目前只有 NapCat / Lagrange 一类实现支持。

  **为什么限流**

  QQ 对头像和签名的修改有频率风控。短时间反复改，轻则静默失败，重则弹验证、
  临时限制登录。所以默认头像 6 小时一次、签名 1 小时一次、每天合计 4 次。
  这些都能在面板里改，但改快了对账号没好处。

  **为什么默认只认主号**

  改头像是账号级操作。如果对所有人开放，陌生人只需要哄她两句，就能让她把签名
  改成广告、把头像换成别人的图。所以工具默认只在主号会话里生效——
  这一条和第 7.5 节的「越权」是同一个道理：她对自己同样没有处置权，
  除非那是你。

  **关于 QQ 零钱**

  做不到。NapCat 是聊天客户端的钩子，不是支付客户端，整个包里没有任何钱包、
  余额、转账相关的接口。支付要过财付通的密码与人脸校验，那不在协议层。

  这件事没有技术路径，也不该去绕。要做账目管理，只能另做一本自己的账，
  而不是去动真钱。
help: |
  **命令（管理员）**

  - `/换头像` —— 不带参数时列出可选图片；`/换头像 雨天` 换指定那张
  - `/签名 今天风很大` —— 直接改签名
  - `/我的形象` —— 当前昵称、上次换头像/改签名的时间与内容、剩余次数

  **她会自己用的工具**

  - `set_avatar(image)` —— 换头像，image 可以是目录里的名字或关键词
  - `set_signature(text)` —— 改签名
  - `list_avatar_options()` —— 看有哪些图可选

  **准备头像**

  把图片放进插件数据目录的 `avatars/`，文件名会变成她嘴里的「那张图的代号」，
  例如 `雨天.png`、`深夜.jpg`。名字起得有画面感一点，她挑起来才像在挑。
